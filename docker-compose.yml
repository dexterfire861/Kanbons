services:
  kanbons:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - po_eval:/app/data/po_eval
    restart: unless-stopped

volumes:
  po_eval:
